<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Estellar магазин</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="page-container">

                <line x1="4" y1="9" x2="8" y2="17"/><line x1="20" y1="9" x2="16" y2="17"/>
              </svg>
            </span>
            <span class="space-nav__text">
              <span class="space-nav__title">Получение валюты</span>
            </span>
          </a>
        </li>
        <li class="space-nav__item">
          <a href="#" class="space-nav__link" data-section="salary">
            <span class="space-nav__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </span>
            <span class="space-nav__text">
              <span class="space-nav__title">Зарплата админов</span>
            </span>
          </a>
        </li>
        <li class="space-nav__item">
          <a href="#" class="space-nav__link" data-section="achievements">

              <span class="space-nav__title">Выплаты при достижениях</span>
            </span>
          </a>

    <div class="welcome-banner" id="welcomeBanner">

        <h2>estellar introduction</h2>
        <p>Дорогие участники Estellar, мы рады представить вам магазин нашего флуда. С помощью валюты «Терра», ⏚, вы сможете приобрести различные товары.</p>
      </div>
    </div>

    <div class="fanfic-grid" id="fanficGrid"></div>
